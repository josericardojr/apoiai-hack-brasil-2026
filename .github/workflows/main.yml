name: Publicar README no GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'README.md', '_config.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          cp README.md site/
          if [ -f _config.yml ]; then cp _config.yml site/; fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
